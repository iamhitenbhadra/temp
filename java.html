                        code: `import java.util.Scanner;

public class DiamondPattern {
    public static void main(String[] args) {
        Scanner scanner = new Scanner(System.in);
        System.out.print("Enter the number of rows (half of the diamond): ");
        int n = scanner.nextInt();
        
        // Upper half
        for (int i = 1; i <= n; i++) {
            for (int j = i; j < n; j++) {
                System.out.print(" ");
            }
            for (int j = 1; j <= (2 * i - 1); j++) {
                System.out.print("*");
            }
            System.out.println();
        }
        
        // Lower half
        for (int i = n - 1; i >= 1; i--) {
            for (int j = n; j > i; j--) {
                System.out.print(" ");
            }
            for (int j = 1; j <= (2 * i - 1); j++) {
                System.out.print("*");
            }
            System.out.println();
        }
        scanner.close();
    }
}`

                        code: `import java.util.Scanner;

public class CumulativeVowelCounter {
    public static void main(String[] args) {
        Scanner scanner = new Scanner(System.in);
        int totalA = 0, totalE = 0, totalI = 0, totalO = 0, totalU = 0;

        while (true) {
            System.out.print("Enter a sentence (type 'quit' to exit): ");
            String sentence = scanner.nextLine();
            
            if (sentence.trim().equalsIgnoreCase("quit")) {
                break;
            }

            int countA = 0, countE = 0, countI = 0, countO = 0, countU = 0;
            for (char ch : sentence.toLowerCase().toCharArray()) {
                switch (ch) {
                    case 'a': countA++; totalA++; break;
                    case 'e': countE++; totalE++; break;
                    case 'i': countI++; totalI++; break;
                    case 'o': countO++; totalO++; break;
                    case 'u': countU++; totalU++; break;
                }
            }

            System.out.println("Vowels in this sentence -> A: " + countA + ", E: " + countE + ", I: " + countI + ", O: " + countO + ", U: " + countU);
        }

        System.out.println("\\n--- Total Vowel Count Across All Sentences ---");
        System.out.println("A: " + totalA + ", E: " + totalE + ", I: " + totalI + ", O: " + totalO + ", U: " + totalU);
        scanner.close();
    }
}`

class Square extends Shapes {

    @Override
    void area() {

    void area() {

}

class Circle extends Shapes {

}`

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function copyCode(btn, progId) {
            const codeElem = document.getElementById(`code-${progId}`);
            const textToCopy = codeElem.textContent;

            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    const originalHtml = btn.innerHTML;
                    btn.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i><span class="text-emerald-400">Copied!</span>`;
                    btn.classList.add('border-emerald-500/50');
                    setTimeout(() => {
                        btn.innerHTML = originalHtml;
                        btn.classList.remove('border-emerald-500/50');
                    }, 2000);
                }
            } catch (err) {
                console.error('Copy error:', err);
            }
            document.body.removeChild(textarea);
        }

                activeNav.classList.add('bg-blue-600/10', 'text-white', 'border-l-2', 'border-blue-500');
            }

            document.getElementById('activeModuleBadge').textContent = modTitle.split(':')[0];
            
            modulesData.forEach(mod => {
                mod.programs.forEach(p => {
                    if (p.id === progId) {
                        document.getElementById('activeHeaderTitle').textContent = p.title;
                    }
                });
            });
        }

        function expandAll() {
            document.querySelectorAll('.program-card').forEach(card => {
                card.style.display = 'block';
            });
        }

        function collapseAll() {
            // Optional collapse logic if needed
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
            if (modulesData.length > 0 && modulesData[0].programs.length > 0) {
                setActiveProgram(modulesData[0].programs[0].id, modulesData[0].moduleTitle);
            }

            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                document.querySelectorAll('.program-card').forEach(card => {
                    const text = card.textContent.toLowerCase();
                    if (text.includes(term)) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        });
    </script>
</body>
</html>
