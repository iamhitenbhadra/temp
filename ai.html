<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python & AI Lab - BNMIT Code Repository</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        panelBg: '#111827',
                        cardBg: '#1a2234',
                        borderSubtle: '#26334d',
                        accentBlue: '#3b82f6',
                        accentGlow: '#60a5fa'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['Fira Code', 'JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- Inter Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #26334d;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3b82f6;
        }
        body, html {
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #090d16;
            color: #f3f4f6;
        }
        pre code {
            font-family: 'Fira Code', monospace;
        }
    </style>
</head>
<body class="bg-darkBg h-screen text-slate-100 flex flex-col antialiased selection:bg-blue-500 selection:text-white">

    <div class="flex flex-col lg:flex-row h-full w-full overflow-hidden">
        
        <!-- Sidebar Navigation (Fixed height with independent inner scroll) -->
        <aside class="w-full lg:w-80 bg-panelBg border-r border-borderSubtle flex flex-col h-full shrink-0">
            <!-- Header Brand -->
            <div class="p-5 border-b border-borderSubtle shrink-0">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold shadow-lg shadow-blue-500/30">
                        <i class="fa-solid fa-brain"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-sm text-white tracking-wide">BNMIT • Python & AI Lab</h1>
                        <p class="text-xs text-slate-400">Machine Learning & NLP Suite</p>
                    </div>
                </div>
            </div>

            <!-- Search Filter Bar -->
            <div class="p-4 border-b border-borderSubtle shrink-0">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-search text-xs"></i>
                    </span>
                    <input type="text" id="searchInput" placeholder="Search lab programs..." 
                        class="w-full pl-9 pr-4 py-2 bg-cardBg border border-borderSubtle rounded-lg text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors">
                </div>
            </div>

            <!-- Vertical Stacked Navigation List (Scrollable independently) -->
            <nav id="sidebarNav" class="flex-1 overflow-y-auto p-4 space-y-6">
                <!-- Populated dynamically via JavaScript -->
            </nav>

            <!-- Footer Info -->
            <div class="p-4 border-t border-borderSubtle text-xs text-slate-500 flex justify-between items-center shrink-0">
                <span>AI & Data Lab</span>
                <span class="bg-cardBg px-2 py-1 rounded text-slate-400 font-mono">Python 3.10+</span>
            </div>
        </aside>

        <!-- Main Content Area (Independent Scrollable Container) -->
        <main class="flex-1 flex flex-col h-full overflow-y-auto">
            <!-- Top Navbar / Info Banner -->
            <header class="bg-panelBg border-b border-borderSubtle px-6 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 sticky top-0 z-20 backdrop-blur-md bg-opacity-90 shrink-0">
                <div>
                    <span id="activeModuleBadge" class="inline-block px-2.5 py-0.5 rounded text-[10px] font-semibold bg-blue-500/20 text-blue-400 mb-1 tracking-wider uppercase">Natural Language Processing</span>
                    <h2 id="activeHeaderTitle" class="text-lg font-bold text-white tracking-tight">1. Text Tokenization, Frequency & Bar Chart</h2>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="expandAll()" class="px-3 py-1.5 bg-cardBg hover:bg-slate-800 border border-borderSubtle text-xs font-medium text-slate-300 rounded-lg transition-colors flex items-center space-x-1.5">
                        <i class="fa-solid fa-expand text-[10px]"></i>
                        <span>Expand All</span>
                    </button>
                    <button onclick="collapseAll()" class="px-3 py-1.5 bg-cardBg hover:bg-slate-800 border border-borderSubtle text-xs font-medium text-slate-300 rounded-lg transition-colors flex items-center space-x-1.5">
                        <i class="fa-solid fa-compress text-[10px]"></i>
                        <span>Collapse All</span>
                    </button>
                </div>
            </header>

            <!-- Programs Container Feed -->
            <div id="programsContainer" class="p-6 max-w-5xl w-full mx-auto space-y-8 pb-16">
                <!-- Dynamically rendered program cards -->
            </div>
        </main>
    </div>

    <script>
        const labData = [
            {
                categoryTitle: "Module 1: Natural Language Processing & Expert Systems",
                categoryId: "mod1",
                programs: [
                    {
                        id: "p1",
                        title: "1. Text Tokenization, Frequency & Bar Chart",
                        filename: "text_token_freq.py",
                        desc: "Tokenizes input text, removes English stop words, computes word frequencies using Counter, and plots a matplotlib bar chart.",
                        code: `import nltk
from nltk.tokenize import word_tokenize
from nltk.corpus import stopwords
from collections import Counter
import matplotlib.pyplot as plt

text = """Artificial Intelligence is used in healthcare
education transportation machine learning helps
computers learn patterns from data and make
useful prediction."""

words = word_tokenize(text.lower())
words = [w for w in words if w.isalpha()]

stop_words = set(stopwords.words("english"))
filtered = [w for w in words if w not in stop_words]

frequency = Counter(filtered)

print("Most frequent words:")
for word, count in frequency.most_common(10):
    print(f"{word}: {count}")

top = frequency.most_common(8)
labels = [x[0] for x in top]
values = [x[1] for x in top]

plt.bar(labels, values, color='#3b82f6')
plt.title("Top words in the text")
plt.xlabel("Words")
plt.ylabel("Frequency")
plt.xticks(rotation=60)
plt.tight_layout()
plt.show()`
                    },
                    {
                        id: "p2",
                        title: "2. AI Agriculture Assistant Rule-Based Expert System",
                        filename: "agri_expert_system.py",
                        desc: "An interactive rule-based expert system that recommends optimal crops based on soil type, season, and water availability.",
                        code: `print("--- AI Agriculture Assistant ---")
print("Answer the following questions:")

soil = input("What is the soil type? ")
season = input("What is the current season? ")
water = input("Water availability (low/high)? ")
goal = input("Main goal (food/income/both)? ")

print("\\nPossible recommendations:")

soil_l = soil.lower()
season_l = season.lower()
water_l = water.lower()

if "red" in soil_l and "kharif" in season_l:
    crops = ["maize", "groundnut", "pulses"]
elif "black" in soil_l:
    crops = ["cotton", "sorghum", "pulses"]
elif "loamy" in soil_l:
    crops = ["maize", "vegetables", "pulses"]
else:
    crops = ["millets", "pulses", "groundnut"]

if water_l == "low":
    crops = [c for c in crops if c not in ["vegetables"]]

for crop in crops:
    print("-", crop)

print("\\nNote: This is an educational decision-support example.")
print("Validate crop choices using soil tests and local agriculture experts.")
print("Check weather information and current market conditions.")`
                    },
                    {
                        id: "p3",
                        title: "3. Ethical Loan Decision Support System",
                        filename: "loan_decision_system.py",
                        desc: "Demonstrates transparent loan evaluation rules using financial metrics while ensuring fair applicant handling without demographic bias.",
                        code: `def loan_decision(income, credit_score, debt):
    if income >= 30000 and credit_score >= 700 and debt < 0.40:
        return "Eligible for further consideration"
    else:
        return "Needs additional financial review"

names = ["Raj", "John", "Asha", "Maria"]

for name in names:
    print(f"\\nApplicant name: {name}")
    print("Name alone cannot determine loan approval.")

income = float(input("\\nMonthly income: "))
credit_score = int(input("Credit score: "))
debt = float(input("Debt-to-income ratio (0 to 1): "))

print("\\nDecision-support result:")
print(loan_decision(income, credit_score, debt))

print("\\nPrinciple: The name is not used in the decision.")`
                    }
                ]
            },
            {
                categoryTitle: "Module 2: Generative AI & Deep Learning CNNs",
                categoryId: "mod2",
                programs: [
                    {
                        id: "p4",
                        title: "4. Text Generation using Hugging Face Transformers",
                        filename: "text_generator_hf.py",
                        desc: "Utilizes the Hugging Face transformers pipeline with distilgpt2 to generate creative text completions from a prompt.",
                        code: `# Run: pip install transformers torch
from transformers import pipeline

generator = pipeline("text-generation", model="distilgpt2")

prompt = """
A futuristic green city has solar-powered buildings, vertical gardens,
electric transport and clean public spaces.
"""

result = generator(
    prompt,
    max_new_tokens=80,
    num_return_sequences=1,
    do_sample=True,
    temperature=0.8
)

print(result[0]["generated_text"])`
                    },
                    {
                        id: "p5",
                        title: "5. TensorFlow Image Classification (Smiling Dataset CNN)",
                        filename: "smiling_cnn_classifier.py",
                        desc: "End-to-end TensorFlow Convolutional Neural Network pipeline for image dataset extraction, preprocessing, training, and evaluation.",
                        code: `# Run: pip install tensorflow
import tensorflow as tf
from tensorflow.keras import layers, models
import os

print("TensorFlow Version:", tf.__version__)

DATASET = r"C:\\Users\\HP\\Desktop\\smiling_dataset"
IMG_SIZE = (180, 180)
BATCH_SIZE = 16

# Load training dataset with 20% validation split
train_ds = tf.keras.utils.image_dataset_from_directory(
    DATASET,
    validation_split=0.2,
    subset="training",
    seed=123,
    image_size=IMG_SIZE,
    batch_size=BATCH_SIZE
)

val_ds = tf.keras.utils.image_dataset_from_directory(
    DATASET,
    validation_split=0.2,
    subset="validation",
    seed=123,
    image_size=IMG_SIZE,
    batch_size=BATCH_SIZE
)

class_names = train_ds.class_names
print("Classes:", class_names)

# Build Sequential CNN Model
model = models.Sequential([
    layers.Rescaling(1./255, input_shape=IMG_SIZE + (3,)),
    layers.Conv2D(16, 3, activation="relu"),
    layers.MaxPooling2D(),
    layers.Conv2D(32, 3, activation="relu"),
    layers.MaxPooling2D(),
    layers.Flatten(),
    layers.Dense(64, activation="relu"),
    layers.Dense(len(class_names), activation="softmax")
])

model.compile(
    optimizer="adam",
    loss="sparse_categorical_crossentropy",
    metrics=["accuracy"]
)

model.summary()

# Train Model
model.fit(
    train_ds,
    validation_data=val_ds,
    epochs=5
)

# Evaluate Validation Accuracy
loss, accuracy = model.evaluate(val_ds)
print(f"Validation accuracy: {accuracy:.2%}")`
                    }
                ]
            }
        ];

        function renderApp() {
            const sidebarNav = document.getElementById('sidebarNav');
            const programsContainer = document.getElementById('programsContainer');

            let sidebarHtml = '';
            let contentHtml = '';

            labData.forEach(cat => {
                sidebarHtml += `
                    <div class="space-y-2">
                        <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 px-3 py-1 bg-cardBg/50 rounded">${cat.categoryTitle}</div>
                        <div class="space-y-1">
                `;

                cat.programs.forEach(prog => {
                    sidebarHtml += `
                        <a href="#${prog.id}" onclick="setActiveProgram('${prog.id}', '${cat.categoryTitle}')" id="nav-${prog.id}" 
                            class="sidebar-item flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-slate-300 hover:text-white hover:bg-cardBg transition-all group">
                            <span class="truncate pr-2">${prog.title}</span>
                            <i class="fa-solid fa-chevron-right text-[9px] text-slate-600 group-hover:text-blue-400 transition-colors"></i>
                        </a>
                    `;

                    contentHtml += `
                        <section id="${prog.id}" class="program-card bg-panelBg border border-borderSubtle rounded-xl overflow-hidden shadow-xl transition-all hover:border-slate-700">
                            <!-- Card Header -->
                            <div class="px-6 py-4 bg-cardBg border-b border-borderSubtle flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                                <div>
                                    <div class="flex items-center space-x-2 mb-1">
                                        <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-blue-500/10 text-blue-400">${cat.categoryTitle.split(':')[0]}</span>
                                        <span class="text-xs font-mono text-slate-400"><i class="fa-regular fa-file-code mr-1"></i>${prog.filename}</span>
                                    </div>
                                    <h3 class="text-base font-bold text-white tracking-tight">${prog.title}</h3>
                                </div>
                                <button onclick="copyCode(this, '${prog.id}')" 
                                    class="inline-flex items-center space-x-2 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 active:scale-95 border border-borderSubtle rounded-lg text-xs font-medium text-slate-200 transition-all shadow-sm">
                                    <i class="fa-regular fa-copy text-blue-400"></i>
                                    <span>Copy Code</span>
                                </button>
                            </div>

                            <!-- Description -->
                            <div class="px-6 py-3 bg-panelBg/50 border-b border-borderSubtle/50 text-xs text-slate-300">
                                <span class="font-semibold text-slate-400">Description:</span> ${prog.desc}
                            </div>

                            <!-- Code Block Viewer -->
                            <div class="relative bg-[#070b12] p-4 sm:p-6 overflow-x-auto">
                                <pre><code id="code-${prog.id}" class="text-xs sm:text-sm text-slate-200 leading-relaxed">${escapeHtml(prog.code)}</code></pre>
                            </div>
                        </section>
                    `;
                });

                sidebarHtml += `</div></div>`;
            });

            sidebarNav.innerHTML = sidebarHtml;
            programsContainer.innerHTML = contentHtml;
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function copyCode(btn, progId) {
            const codeElem = document.getElementById(`code-${progId}`);
            const textToCopy = codeElem.textContent;

            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    const originalHtml = btn.innerHTML;
                    btn.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i><span class="text-emerald-400">Copied!</span>`;
                    btn.classList.add('border-emerald-500/50');
                    setTimeout(() => {
                        btn.innerHTML = originalHtml;
                        btn.classList.remove('border-emerald-500/50');
                    }, 2000);
                }
            } catch (err) {
                console.error('Copy error:', err);
            }
            document.body.removeChild(textarea);
        }

        function setActiveProgram(progId, catTitle) {
            document.querySelectorAll('.sidebar-item').forEach(el => {
                el.classList.remove('bg-blue-600/10', 'text-white', 'border-l-2', 'border-blue-500');
            });
            const activeNav = document.getElementById(`nav-${progId}`);
            if (activeNav) {
                activeNav.classList.add('bg-blue-600/10', 'text-white', 'border-l-2', 'border-blue-500');
            }

            document.getElementById('activeModuleBadge').textContent = catTitle.split(':')[0];
            
            labData.forEach(cat => {
                cat.programs.forEach(p => {
                    if (p.id === progId) {
                        document.getElementById('activeHeaderTitle').textContent = p.title;
                    }
                });
            });
        }

        function expandAll() {
            document.querySelectorAll('.program-card').forEach(card => {
                card.style.display = 'block';
            });
        }

        function collapseAll() {
            // Optional collapse logic or show all
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
            if (labData.length > 0 && labData[0].programs.length > 0) {
                setActiveProgram(labData[0].programs[0].id, labData[0].categoryTitle);
            }

            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                document.querySelectorAll('.program-card').forEach(card => {
                    const text = card.textContent.toLowerCase();
                    if (text.includes(term)) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        });
    </script>
</body>
</html>
